<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Badge for High Contrast in Light/Dark Browser Tabs -->
  <circle cx="32" cy="32" r="30" fill="#D9251D" stroke="#21110B" stroke-width="4"/>
  <circle cx="32" cy="32" r="27.5" fill="#D9251D" stroke="#FFFBF5" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Pizza Slice Group -->
  <g transform="translate(0, 1)">
    <!-- Golden Sourdough Blistered Crust -->
    <path d="M16 23C21 16.5 43 16.5 48 23C46 26 43 27 32 27C21 27 18 26 16 23Z" fill="#E5A93C" stroke="#21110B" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Char Blisters -->
    <ellipse cx="23" cy="20.5" rx="2" ry="1.2" fill="#78350F"/>
    <ellipse cx="32" cy="19" rx="2.5" ry="1.5" fill="#5B2207"/>
    <ellipse cx="41" cy="20.5" rx="1.8" ry="1.2" fill="#78350F"/>

    <!-- Melted Mozzarella & Rich Tomato Base -->
    <path d="M17.5 24.5L32 53L46.5 24.5C39 27.5 25 27.5 17.5 24.5Z" fill="#FBBF24" stroke="#21110B" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Cheese Melt Drips -->
    <path d="M26 31C26 34.5 28.5 36.5 29.5 36.5C30.5 36.5 32 34.5 32 30" fill="#FEF08A"/>
    <path d="M37 32C37 35 38.5 36.5 39.5 36.5C40.5 36.5 41.5 35 41.5 31" fill="#FEF08A"/>

    <!-- Crispy Cupped Pepperonis -->
    <!-- Pepperoni 1 -->
    <circle cx="28" cy="29" r="4.5" fill="#B91C1C" stroke="#21110B" stroke-width="1.8"/>
    <circle cx="26.8" cy="27.8" r="1.5" fill="#EF4444"/>
    <circle cx="28.8" cy="29.8" r="1" fill="#7F1D1D"/>

    <!-- Pepperoni 2 -->
    <circle cx="37.5" cy="32.5" r="4" fill="#B91C1C" stroke="#21110B" stroke-width="1.8"/>
    <circle cx="36.5" cy="31.5" r="1.3" fill="#EF4444"/>
    <circle cx="38.2" cy="33.2" r="0.9" fill="#7F1D1D"/>

    <!-- Pepperoni 3 -->
    <circle cx="32" cy="42" r="3.6" fill="#B91C1C" stroke="#21110B" stroke-width="1.8"/>
    <circle cx="31.2" cy="41.2" r="1.2" fill="#EF4444"/>
    <circle cx="32.6" cy="42.6" r="0.8" fill="#7F1D1D"/>

    <!-- Fresh Basil Leaves -->
    <path d="M21 37C21 37 23.5 40 27 38.5C26.5 35.5 24 34.5 21 37Z" fill="#16A34A" stroke="#21110B" stroke-width="1.5"/>
    <path d="M36 24C36 24 38 22 41 23C40.5 25 38.5 26 36 24Z" fill="#16A34A" stroke="#21110B" stroke-width="1.5"/>
  </g>

  <!-- Sparkle Accent -->
  <path d="M50 12L51 15L54 16L51 17L50 20L49 17L46 16L49 15Z" fill="#FFFBF5"/>
</svg>
